name: Build APK

# Läuft automatisch bei jedem Push nach main/master,
# oder manuell über den "Run workflow"-Button im Actions-Tab.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LedController-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
